<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DEFORM8</title>
<style>
  :root{
    --bg:#0b0b0d; --panel:#16161a; --line:#2a2a31; --fg:#f2f2f4; --dim:#8b8b96; --accent:#8B5CF6; --rec:#ff3b3b;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Inter",sans-serif}
  .app{display:grid;grid-template-columns:auto 320px;gap:24px;height:100%;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));justify-content:center}
  .stage{position:relative;height:calc(100vh - 40px);aspect-ratio:9/16;max-width:100%;background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
  canvas{width:100%;height:100%;display:block}
  .badge{position:absolute;top:14px;left:14px;padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.55);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  .badge.rec{background:var(--rec);display:none}
  .badge.rec.on{display:block}
  .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--dim)}
  .side{display:flex;flex-direction:column;gap:16px;min-width:0;overflow:auto;padding-bottom:12px}
  h1{font-size:22px;margin:0;letter-spacing:.04em}
  h1 span{color:var(--accent)}
  .label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:6px}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .f{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px;text-align:left;cursor:pointer;font:inherit}
  .f b{display:block;font-size:13px}
  .f small{color:var(--dim);font-size:11px}
  .f kbd{float:right;color:var(--dim);font-size:11px}
  .f.on{border-color:var(--accent);background:#1e1730}
  .f:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  select{width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px 14px;cursor:pointer;font:inherit}
  .btn.big{flex:1;padding:14px;font-weight:600}
  .btn.recbtn{background:var(--rec);border-color:var(--rec)}
  .btn.recbtn.on{background:#fff;color:#000;border-color:#fff}
  .meter{height:6px;background:var(--panel);border-radius:3px;overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:var(--accent)}
  .takes{display:flex;flex-direction:column;gap:8px}
  .take{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
  .take video{width:54px;height:96px;object-fit:cover;border-radius:6px;background:#000}
  .take a{color:var(--accent)}
  .take.unsaved{border-color:var(--rec)}
  .btn.del{padding:6px 10px}
  .small{color:var(--dim);font-size:12px}
  label.chk{display:flex;gap:6px;align-items:center;color:var(--dim)}
  .mobile-only{display:none}
  .hint .btn{margin-top:14px}
  /* iPhone: Bild bildschirmfüllend, Bedienung unten drüber */
  @media (max-width:800px), (pointer:coarse){
    html,body{overflow:hidden;overscroll-behavior:none}
    .app{display:block;padding:0;height:100dvh}
    .stage{position:fixed;inset:0;height:100%;width:100%;border:0;border-radius:0;aspect-ratio:auto}
    canvas{object-fit:cover}
    .badge{top:calc(env(safe-area-inset-top,0px) + 10px)}
    .side{position:fixed;left:0;right:0;bottom:0;gap:10px;overflow:visible;
      padding:40px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px));
      background:linear-gradient(transparent,rgba(0,0,0,.75) 45%)}
    .desk-only,.label,h1,.f small,.f kbd{display:none}
    .mobile-only{display:flex}
    .filters{display:flex;overflow-x:auto;gap:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
    .filters::-webkit-scrollbar{display:none}
    .f{flex:0 0 auto;padding:8px 12px;border-radius:999px;background:rgba(22,22,26,.8)}
    .f b{font-size:13px;white-space:nowrap}
    .ctrl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
    .grp{gap:8px}
    .btn.recbtn{flex:0 0 auto;width:74px;height:74px;border-radius:50%;padding:0;font-size:0;border:5px solid #fff;background:var(--rec)}
    .btn.recbtn.on{background:var(--rec);border-radius:22px;border-color:#fff}
    .round{width:52px;height:52px;border-radius:50%;padding:0;background:rgba(22,22,26,.8);font-size:20px;justify-content:center;align-items:center}
    .takes{flex-direction:row;overflow-x:auto}
    .takes .small{display:none}
    .take{flex:0 0 auto;padding:6px}
    .take video{width:40px;height:72px}
    .take .meta{display:none}
  }
  /* iPhone Duo aufgeklappt (fast quadratisch): ganzes 9:16-Bild zeigen, genau das wird aufgenommen */
  @media (pointer:coarse) and (min-aspect-ratio:3/4), (max-width:800px) and (min-aspect-ratio:3/4){ canvas{object-fit:contain} }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="out" width="1080" height="1920"></canvas>
    <div class="badge" id="fname">Normal</div>
    <div class="badge rec" id="recBadge" style="left:auto;right:14px">● REC 0:00</div>
    <div class="hint" id="hint"><div><div id="hintText">Kamera und Mikro starten</div><button class="btn big" id="start2" style="width:240px">Kamera starten</button></div></div>
  </div>
  <div class="side">
    <h1>DEFORM<span>8</span></h1>
    <div class="desk-only">
      <div class="label">Kamera</div>
      <select id="cam"><option>Erst Kamera starten</option></select>
      <div class="row" style="margin-top:8px">
        <button class="btn big" id="start">Kamera starten</button>
      </div>
      <div class="row" style="margin-top:8px">
        <label class="chk"><input type="checkbox" id="mirror" checked> Spiegeln</label>
        <span class="small" id="track">Gesichtserkennung lädt …</span>
      </div>
    </div>
    <div class="desk-only">
      <div class="label">Mikro-Pegel (treibt die Filter mit)</div>
      <div class="meter"><i id="lvl"></i></div>
    </div>
    <div class="takes" id="takes"><span class="small">Noch keine Aufnahmen. Jede Aufnahme landet hier zum Speichern.</span></div>
    <div>
      <div class="label">Filter (Tasten 0–9, auch während der Aufnahme)</div>
      <div class="filters" id="filters"></div>
    </div>
    <div class="row ctrl">
      <div class="grp mobile-only"><button class="btn round" id="flip" aria-label="Kamera wechseln">⇄</button><button class="btn round" id="rot" aria-label="Bild drehen">↻</button></div>
      <button class="btn big recbtn" id="rec" disabled>Aufnahme (Leertaste)</button>
      <div class="grp mobile-only" style="justify-content:flex-end"><button class="btn round" id="mir2" aria-label="Spiegeln umschalten">◐</button></div>
    </div>
  </div>
</div>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform sampler2D uTex;
uniform vec2 uRes, uVid, uOff;
uniform float uScale, uMirror;
uniform vec2 uFace, uEyeL, uEyeR, uMouth, uChin, uForehead, uNose;
uniform float uFS, uOpen, uLevel, uTime;
uniform int uMode;

vec2 lens(vec2 p, vec2 c, float r, float k){
  vec2 d = p - c; float t = length(d) / r;
  if (t >= 1.0) return p;
  float f = 1.0 - t*t; f *= f;
  return c + d * (1.0 - k*f);
}
vec3 cam(vec2 p){
  vec2 v = (p - uOff) / uScale;
  if (uMirror > 0.5) v.x = uVid.x - v.x;
  return texture2D(uTex, clamp(v / uVid, 0.001, 0.999)).rgb;
}
float hash(vec2 s){ return fract(sin(dot(s, vec2(12.9898, 78.233))) * 43758.5453); }

void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 q = p; float fs = uFS;
  vec3 col;

  if (uMode == 1) {            // QUETSCHE
    q = lens(q, uNose, fs*1.0, -1.2);
  } else if (uMode == 2) {     // KULLERAUGEN
    q = lens(q, uEyeL, fs*0.32, 0.62);
    q = lens(q, uEyeR, fs*0.32, 0.62);
    q = lens(q, uMouth, fs*0.38, -0.7);
    q = lens(q, uChin, fs*0.45, -0.5);
  } else if (uMode == 3) {     // SCHREIHALS
    float k = clamp(0.12 + uOpen*1.3 + uLevel*0.35, 0.0, 0.84);
    q = lens(q, uMouth, fs*(0.42 + 0.3*uOpen), k);
  } else if (uMode == 4) {     // HÖHENFLUG
    float s = uLevel * 1.1;
    float dx = (p.x - uFace.x) / (fs*0.8);
    float w = exp(-dx*dx);
    if (p.y < uChin.y) {
      q.y = uChin.y + (p.y - uChin.y) / (1.0 + s*w);
      q.x = uFace.x + (p.x - uFace.x) * (1.0 + 0.3*s*w);
    }
  } else if (uMode == 5) {     // WACKELPUDDING
    float A = fs * (0.012 + 0.11*uLevel);
    vec2 d = p - uFace;
    float w = exp(-dot(d,d) / (fs*fs*0.55));
    q += A * w * vec2(sin(p.y/fs*14.0 + uTime*21.0), cos(p.x/fs*11.0 + uTime*17.0));
  } else if (uMode == 6) {     // EIERKOPF
    q = lens(q, uForehead + (uForehead - uFace)*0.35, fs*0.95, 0.6);
    q = lens(q, uChin, fs*0.55, -0.9);
  } else if (uMode == 9) {     // BABYSCHREI: Kulleraugen dauerhaft, Mund klein und wächst beim Öffnen
    float o = uOpen;
    float k = clamp(-0.7 + o*2.0 + uLevel*0.35, -0.7, 0.84);
    q = lens(q, uMouth, fs*(0.38 + 0.34*o), k);
    q = lens(q, uChin, fs*0.45, -0.5*(1.0 - o));
    q = lens(q, uEyeL, fs*0.32, 0.62);
    q = lens(q, uEyeR, fs*0.32, 0.62);
  } else if (uMode == 8) {     // ZWILLING
    if (p.x > uFace.x) q.x = 2.0*uFace.x - p.x;
  }

  if (uMode == 7) {            // AUTOTUNE-GLITCH
    float lv = uLevel;
    float band = floor(p.y / 28.0);
    float tick = floor(uTime * 14.0);
    float r = hash(vec2(band, tick));
    if (r < 0.08 + lv*0.55) q.x += (hash(vec2(band+3.1, tick)) - 0.5) * fs * (0.1 + 0.6*lv);
    float steps = mix(1.0, 22.0, smoothstep(0.35, 0.9, lv));
    if (steps > 1.5) q = floor(q / steps) * steps + steps*0.5;
    float o = 3.0 + lv*36.0;
    col = vec3(cam(q + vec2(o,0.0)).r, cam(q).g, cam(q - vec2(o,0.0)).b);
  } else {
    col = cam(q);
  }
  gl_FragColor = vec4(col, 1.0);
}
</script>

<script type="module">
const FILTERS = [
  {name:'Normal', desc:'ohne Filter'},
  {name:'Quetsche', desc:'die Photo-Booth-Hommage'},
  {name:'Kulleraugen', desc:'Babyface, Mini-Mund'},
  {name:'Schreihals', desc:'Mund wächst beim Singen'},
  {name:'Höhenflug', desc:'je lauter, desto Eierkopf'},
  {name:'Wackelpudding', desc:'Gesicht wabbelt zur Stimme'},
  {name:'Eierkopf', desc:'Alien-Stirn, Mini-Kinn'},
  {name:'Autotune-Glitch', desc:'zerfällt, wenn du laut wirst'},
  {name:'Zwilling', desc:'Gesicht gespiegelt'},
  {name:'Babyschrei', desc:'Kulleraugen, Mund wächst beim Singen'},
];
const W = 1080, H = 1920;
let mode = 0;
const $ = id => document.getElementById(id);

// ---- Filter-Knöpfe
const fwrap = $('filters');
FILTERS.forEach((f,i) => {
  const b = document.createElement('button');
  b.className = 'f'; b.id = 'f'+i;
  b.innerHTML = `<kbd>${i}</kbd><b>${f.name}</b><small>${f.desc}</small>`;
  b.onclick = () => setMode(i);
  fwrap.appendChild(b);
});
function setMode(i){ mode = i; document.querySelectorAll('.f').forEach((b,j)=>b.classList.toggle('on', j===i)); $('fname').textContent = FILTERS[i].name; }
setMode(1);

// ---- WebGL
const canvas = $('out');
const gl = canvas.getContext('webgl', {premultipliedAlpha:false, preserveDrawingBuffer:true});
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, $('fs').textContent));
gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const aLoc = gl.getAttribLocation(prog,'a'); gl.enableVertexAttribArray(aLoc); gl.vertexAttribPointer(aLoc,2,gl.FLOAT,false,0,0);
const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
[gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE));
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
const U = n => gl.getUniformLocation(prog, n);
const u = {};
['uTex','uRes','uVid','uOff','uScale','uMirror','uFace','uEyeL','uEyeR','uMouth','uChin','uForehead','uNose','uFS','uOpen','uLevel','uTime','uMode'].forEach(n=>u[n]=U(n));
gl.viewport(0,0,W,H);

// ---- Kamera + Mikro
const video = document.createElement('video'); video.playsInline = true; video.muted = true;
let stream = null, analyser = null, abuf = null;
async function listCams(){
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
  const sel = $('cam'); const cur = stream?.getVideoTracks()[0]?.getSettings().deviceId;
  sel.innerHTML = devs.map(d=>`<option value="${d.deviceId}" ${d.deviceId===cur?'selected':''}>${d.label||'Kamera'}</option>`).join('');
}
const phoneMQ = matchMedia('(max-width:800px), (pointer:coarse)');
const isPhone = () => phoneMQ.matches;
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e) { return null; } };
// Standard: Hauptkamera hinten (iPhone Duo zugeklappt, Außenbildschirm als Sucher)
let facing = store('deform8.facing') || 'environment', ac = null;
if (store('deform8.mirror') === '0') $('mirror').checked = false;
$('mirror').onchange = () => store('deform8.mirror', $('mirror').checked ? '1' : '0');
async function startCam(deviceId){
  if (!ac) ac = new (window.AudioContext||window.webkitAudioContext)();   // im Tipp anlegen, sonst bleibt iOS stumm
  ac.resume();
  if (stream) stream.getTracks().forEach(t=>t.stop());
  const v = isPhone() && !deviceId
    ? {facingMode:facing, width:{ideal:1920}, height:{ideal:1080}, frameRate:{ideal:30, max:30}}   // Handy: volle 1080p wie die übrigen TikToks
    : {deviceId: deviceId?{exact:deviceId}:undefined, width:{ideal:1920}, height:{ideal:1080}, frameRate:{ideal:30}};
  stream = await navigator.mediaDevices.getUserMedia({
    video: v, audio: {echoCancellation:false, noiseSuppression:false, autoGainControl:false}
  });
  video.srcObject = stream; await video.play();
  const src = ac.createMediaStreamSource(stream);
  analyser = ac.createAnalyser(); analyser.fftSize = 1024; abuf = new Float32Array(analyser.fftSize);
  src.connect(analyser);
  $('hint').style.display = 'none'; $('rec').disabled = false;
  // Auf-/Zuklappen kann die Kamera beenden: laufende Aufnahme sichern und Kamera neu starten
  stream.getVideoTracks()[0].addEventListener('ended', camLost);
  try { await navigator.wakeLock?.request('screen'); } catch(e) {}
  await listCams();
}
let restarting = false;
async function camLost(){
  if (restarting) return; restarting = true;
  if (recorder) recorder.stop();
  try { await startCam(); } catch(e) { camFail(e); }
  restarting = false;
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && stream && stream.getVideoTracks()[0]?.readyState === 'ended') camLost();
});
const camFail = e => { $('hint').style.display = 'flex'; $('hintText').textContent = 'Kamera oder Mikro nicht freigegeben (' + e.message + '). Erlaube den Zugriff und tipp nochmal.'; };
$('start').onclick = () => startCam($('cam').value && $('cam').value.length>20 ? $('cam').value : undefined).catch(camFail);
$('start2').onclick = () => startCam().catch(camFail);
$('cam').onchange = e => { if (!recorder) startCam(e.target.value).catch(camFail); };
$('flip').onclick = () => { if (recorder) return; facing = facing === 'user' ? 'environment' : 'user'; store('deform8.facing', facing); startCam().catch(camFail); };
$('mir2').onclick = () => { $('mirror').checked = !$('mirror').checked; $('mirror').onchange(); };

// ---- Drehung: Duo aufgeklappt liefert das Kamerabild quer, Ausgabe bleibt immer 9:16 hoch.
// Gemerkt je Kamera und je Bildlage (quer/hoch), damit Zu- und Aufklappen jeweils stimmt.
const srcCv = document.createElement('canvas'), sctx = srcCv.getContext('2d');
const rotMem = {};
const rotKey = () => `deform8.rot.${facing}.${video.videoWidth > video.videoHeight ? 'quer' : 'hoch'}`;
function curRot(){
  if (!isPhone()) return 0;
  const k = rotKey();
  if (!(k in rotMem)) { const s = store(k); rotMem[k] = s !== null && s !== undefined ? +s : (video.videoWidth > video.videoHeight ? 1 : 0); }
  return rotMem[k];
}
$('rot').onclick = () => { if (!video.videoWidth) return; const k = rotKey(); rotMem[k] = (curRot() + 1) % 4; store(k, String(rotMem[k])); };
// Bildquelle in Vierteldrehungen gegen den Uhrzeigersinn
function source(){
  const r = curRot(), vw = video.videoWidth, vh = video.videoHeight;
  if (!r) return {el:video, w:vw, h:vh};
  const sw = r % 2 ? vh : vw, sh = r % 2 ? vw : vh;
  if (srcCv.width !== sw || srcCv.height !== sh) { srcCv.width = sw; srcCv.height = sh; }
  sctx.setTransform(1,0,0,1,sw/2,sh/2); sctx.rotate(-r*Math.PI/2); sctx.drawImage(video, -vw/2, -vh/2);
  return {el:srcCv, w:sw, h:sh};
}

// ---- Gesichtserkennung (MediaPipe)
let landmarker = null;
(async () => {
  try {
    const {FaceLandmarker, FilesetResolver} = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const files = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    landmarker = await FaceLandmarker.createFromOptions(files, {
      baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate:'GPU'},
      runningMode:'VIDEO', numFaces:1
    });
    $('track').textContent = 'Gesichtserkennung bereit';
  } catch(e) { $('track').textContent = 'Ohne Gesichtserkennung (Filter sitzen mittig)'; console.warn(e); }
})();

// Gesichtspunkte in Ausgabe-Pixeln, geglättet
const F = {face:[W/2,H*0.42], eyeL:[W*0.4,H*0.38], eyeR:[W*0.6,H*0.38], mouth:[W/2,H*0.5], chin:[W/2,H*0.56], forehead:[W/2,H*0.3], nose:[W/2,H*0.44], fs:W*0.5, open:0};
let lastVT = -1, seen = 0, lastDet = 0;
const T = JSON.parse(JSON.stringify(F));   // Ziel aus der letzten Erkennung, F gleitet jedes Bild dorthin
// Erkennung auf verkleinertem Bild: das Modell rechnet ohnehin mit 256 px, das große Bild kostet nur Wärme
const detCv = document.createElement('canvas'), dctx = detCv.getContext('2d');
const DET_MAX = 480, DET_MS = 1000/15 - 4;   // 15 Erkennungen pro Sekunde
function geom(S){
  const vw = S.w, vh = S.h;
  const s = Math.max(W/vw, H/vh);
  return {vw, vh, s, ox:(W - vw*s)/2, oy:(H - vh*s)/2};
}
function track(now, S){
  if (!landmarker || mode === 0 || video.currentTime === lastVT || now - lastDet < DET_MS) return;
  lastVT = video.currentTime; lastDet = now;
  const ds = Math.min(1, DET_MAX / Math.max(S.w, S.h));
  const dw = Math.round(S.w*ds), dh = Math.round(S.h*ds);
  if (detCv.width !== dw || detCv.height !== dh) { detCv.width = dw; detCv.height = dh; }
  dctx.drawImage(S.el, 0, 0, dw, dh);
  const r = landmarker.detectForVideo(detCv, now);
  const lm = r.faceLandmarks?.[0];
  if (!lm) { seen = Math.max(0, seen-1); return; }
  seen = 10;
  const g = geom(S), mir = $('mirror').checked;
  const P = i => { let x = lm[i].x*g.vw; if (mir) x = g.vw - x; return [x*g.s + g.ox, lm[i].y*g.vh*g.s + g.oy]; };
  const mid = (a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const dist = (a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  const eyeA = lm.length>473 ? P(468) : mid(P(33),P(133));
  const eyeB = lm.length>473 ? P(473) : mid(P(362),P(263));
  const t = {eyeL:eyeA, eyeR:eyeB, mouth:mid(P(13),P(14)), chin:P(152), forehead:P(10), nose:mid(P(1),P(168)),
             face:mid(P(10),P(152)), fs:dist(P(234),P(454))};
  t.open = Math.min(1, Math.max(0, (dist(P(13),P(14))/dist(P(61),P(291)) - 0.08) / 0.55));
  for (const key in t) T[key] = t[key];
}
function glide(){
  const k = 0.45;
  for (const key in T) {
    if (Array.isArray(T[key])) { F[key][0] += (T[key][0]-F[key][0])*k; F[key][1] += (T[key][1]-F[key][1])*k; }
    else F[key] += (T[key]-F[key])*k;
  }
}

// ---- Pegel
let level = 0;
function readLevel(){
  if (!analyser) return 0;
  analyser.getFloatTimeDomainData(abuf);
  let sum = 0; for (let i=0;i<abuf.length;i++) sum += abuf[i]*abuf[i];
  const db = 20*Math.log10(Math.sqrt(sum/abuf.length)+1e-9);
  const target = Math.min(1, Math.max(0, (db + 50) / 38));   // -50 dB → 0, -12 dB → 1
  level += (target - level) * (target > level ? 0.5 : 0.12);
  if (!isPhone()) $('lvl').style.width = (level*100).toFixed(0)+'%';
  return level;
}

// ---- Render-Schleife: höchstens 30 Bilder pro Sekunde (iPhone-Bildschirm will sonst 120)
let lastFrame = 0;
window.__d8 = {frames:0, dets:0};
function frame(now){
  requestAnimationFrame(frame);
  if (video.readyState < 2 || now - lastFrame < 1000/30 - 4) return;
  lastFrame = now; __d8.frames++;
  const S = source();
  try { const before = lastDet; track(now, S); if (lastDet !== before) __d8.dets++; } catch(e) {}
  glide();
  readLevel();
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, S.el);
  const g = geom(S);
  gl.uniform1i(u.uTex, 0);
  gl.uniform2f(u.uRes, W, H); gl.uniform2f(u.uVid, g.vw, g.vh); gl.uniform2f(u.uOff, g.ox, g.oy);
  gl.uniform1f(u.uScale, g.s); gl.uniform1f(u.uMirror, $('mirror').checked ? 1 : 0);
  gl.uniform2f(u.uFace, ...F.face); gl.uniform2f(u.uEyeL, ...F.eyeL); gl.uniform2f(u.uEyeR, ...F.eyeR);
  gl.uniform2f(u.uMouth, ...F.mouth); gl.uniform2f(u.uChin, ...F.chin); gl.uniform2f(u.uForehead, ...F.forehead); gl.uniform2f(u.uNose, ...F.nose);
  gl.uniform1f(u.uFS, F.fs); gl.uniform1f(u.uOpen, F.open); gl.uniform1f(u.uLevel, level); gl.uniform1f(u.uTime, now/1000);
  gl.uniform1i(u.uMode, mode);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  if (recorder) { const s = Math.floor((performance.now()-recStart)/1000); $('recBadge').textContent = `● REC ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
}
requestAnimationFrame(frame);

// ---- Aufnahme
// Jede Aufnahme wird schon während des Drehens Stück für Stück auf dem Handy abgelegt (IndexedDB).
// So überlebt sie Neuladen, Schließen, Absturz und Zuklappen und belegt keinen Arbeitsspeicher.
const DB = (() => {
  let p = null;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('deform8', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('takes', {keyPath:'id'}); d.createObjectStore('chunks', {autoIncrement:true}).createIndex('take', 'take'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (stores, mode, fn) => { const d = await open(); return new Promise((res, rej) => { const t = d.transaction(stores, mode); let out; Promise.resolve(fn(t)).then(v => out = v); t.oncomplete = () => res(out); t.onerror = () => rej(t.error); }); };
  const all = req => new Promise(r => req.onsuccess = () => r(req.result));
  return {
    putTake: m => tx(['takes'], 'readwrite', t => { t.objectStore('takes').put(m); }),
    addChunk: (take, blob) => tx(['chunks'], 'readwrite', t => { t.objectStore('chunks').add({take, blob}); }),
    takes: () => tx(['takes'], 'readonly', t => all(t.objectStore('takes').getAll())),
    blobOf: async (m) => { const parts = await tx(['chunks'], 'readonly', t => all(t.objectStore('chunks').index('take').getAll(m.id))); return new Blob(parts.map(c => c.blob), {type: m.type}); },
    del: id => tx(['takes','chunks'], 'readwrite', t => { t.objectStore('takes').delete(id);
      const c = t.objectStore('chunks').index('take').openKeyCursor(IDBKeyRange.only(id));
      c.onsuccess = () => { const cur = c.result; if (cur) { t.objectStore('chunks').delete(cur.primaryKey); cur.continue(); } }; }),
  };
})();

let recorder = null, recStart = 0, cur = null, pending = Promise.resolve();
const TYPES = ['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'];
function toggleRec(){
  if (!stream) return;
  if (recorder) { recorder.stop(); return; }
  const out = canvas.captureStream(30);
  stream.getAudioTracks().forEach(t => out.addTrack(t));
  const type = TYPES.find(t => MediaRecorder.isTypeSupported(t)) || '';
  // 8 Mbit/s: 1080p bleibt sauber, 15 Minuten sind etwa 0,9 GB statt 1,6 GB
  recorder = new MediaRecorder(out, {mimeType:type, videoBitsPerSecond:8_000_000, audioBitsPerSecond:192_000});
  const ext = recorder.mimeType.includes('mp4') ? 'mp4' : 'webm';
  const ts = new Date();
  cur = {id: ts.getTime(), ext, type: ext === 'mp4' ? 'video/mp4' : 'video/webm', done:false, saved:false,
         name:`DEFORM8_${FILTERS[mode].name}_${ts.getHours()}${String(ts.getMinutes()).padStart(2,'0')}${String(ts.getSeconds()).padStart(2,'0')}.${ext}`};
  const m = cur; pending = DB.putTake(m).catch(e => console.warn(e));
  recorder.ondataavailable = e => { if (e.data.size) pending = pending.then(() => DB.addChunk(m.id, e.data)).catch(e => { console.warn(e); note('Speicher voll? Aufnahme wird evtl. nicht gesichert'); }); };
  recorder.onstop = async () => {
    recorder = null; $('rec').classList.remove('on'); $('rec').textContent = 'Aufnahme (Leertaste)'; $('recBadge').classList.remove('on');
    await pending; m.done = true; await DB.putTake(m).catch(()=>{});
    addTake(m, await DB.blobOf(m));
    note('Aufnahme liegt unten – tipp „Sichern“');
  };
  recorder.start(1000); recStart = performance.now();
  $('rec').classList.add('on'); $('rec').textContent = 'Stopp (Leertaste)'; $('recBadge').classList.add('on');
}
let takeNo = 0;
function note(t){
  let n = $('note');
  if (!n) { n = document.createElement('div'); n.id = 'note'; n.className = 'badge';
    n.style.cssText = 'left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 56px);display:block;white-space:nowrap;z-index:9;transition:opacity .4s';
    $('stage').appendChild(n); }
  n.textContent = t; n.style.opacity = 1; clearTimeout(n._t); n._t = setTimeout(() => n.style.opacity = 0, 5000);
}
const unsaved = new Set();
function addTake(m, blob){
  const url = URL.createObjectURL(blob);
  const box = $('takes'); if (!takeNo++) box.innerHTML = '';
  const el = document.createElement('div'); el.className = 'take' + (m.saved ? '' : ' unsaved');
  const mins = blob.size/1e6;
  el.innerHTML = `<video src="${url}#t=0.5" muted loop playsinline preload="metadata"></video><div><div class="meta">${m.name}${m.done ? '' : ' (unterbrochen)'}</div><div class="small meta">${mins < 10 ? mins.toFixed(1) : mins.toFixed(0)} MB</div><button class="btn save">Sichern</button> <button class="btn del" aria-label="Aufnahme löschen">✕</button></div>`;
  const v = el.querySelector('video'); el.onmouseenter = () => v.play(); el.onmouseleave = () => v.pause();
  // Ohne Codec-Zusatz im Typ, sonst lehnt das iPhone-Teilen-Menü die Datei ab
  const file = new File([blob], m.name, {type: m.type});
  if (!m.saved) unsaved.add(m.id);
  const done = () => { m.saved = true; unsaved.delete(m.id); el.classList.remove('unsaved'); DB.putTake(m).catch(()=>{}); };
  el.querySelector('.save').onclick = async () => {
    // iPhone: Teilen-Menü öffnen, dort „Video sichern“ → landet in Fotos
    if (isPhone() && navigator.canShare && navigator.canShare({files:[file]})) {
      try { await navigator.share({files:[file]}); done(); return; } catch(e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = url; a.download = m.name; document.body.appendChild(a); a.click(); a.remove(); done();
    if (isPhone()) note('Als Download gespeichert: App „Dateien“ › Downloads');
  };
  el.querySelector('.del').onclick = async () => {
    if (!confirm(m.saved ? 'Aufnahme aus der Liste löschen? (In Fotos bleibt sie.)' : 'Diese Aufnahme ist noch nicht gesichert. Wirklich löschen?')) return;
    await DB.del(m.id); unsaved.delete(m.id); URL.revokeObjectURL(url); el.remove();
  };
  box.prepend(el);
}
// Beim Laden: alle Aufnahmen vom Handy zurückholen, auch abgebrochene
(async () => {
  try {
    const list = (await DB.takes()).sort((a,b) => a.id - b.id);
    for (const m of list) { const b = await DB.blobOf(m); if (b.size) addTake(m, b); else DB.del(m.id); }
    if (list.some(m => !m.saved)) note('Ungesicherte Aufnahmen gefunden – unten „Sichern“');
  } catch(e) { console.warn('Aufnahmen-Speicher nicht verfügbar', e); }
})();
addEventListener('beforeunload', e => { if (recorder || unsaved.size) { e.preventDefault(); e.returnValue = ''; } });
$('rec').onclick = toggleRec;
addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); toggleRec(); }
  const n = parseInt(e.key); if (n >= 0 && n <= 9) setMode(n);
});
</script>
</body>
</html>
